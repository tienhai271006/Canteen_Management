spring:
  application:
    name: canteen
  profiles:
    default: dev

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/canteen?useUnicode=true&characterEncoding=utf8&connectionTimeZone=Asia/Ho_Chi_Minh}
    username: ${DB_USER:canteen}
    password: ${DB_PASSWORD:canteen}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate          # schema do Flyway quản lý, Hibernate chỉ kiểm tra
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Ho_Chi_Minh
          batch_size: 50
        order_inserts: true
        order_updates: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  jackson:
    time-zone: Asia/Ho_Chi_Minh
    default-property-inclusion: non_null

  servlet:
    multipart:
      max-file-size: 3MB
      max-request-size: 4MB

  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USER:}
    password: ${MAIL_PASS:}
    properties:
      mail.smtp.auth: ${MAIL_SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${MAIL_STARTTLS:false}

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never

app:
  timezone: Asia/Ho_Chi_Minh
  promotion:
    # Phần trăm khoản giảm ưu đãi đơn đầu do nền tảng chịu; quầy chịu phần còn lại.
    platform-share-percent: 70
  mail:
    from: ${MAIL_FROM:no-reply@canteen.local}
  jwt:
    # Tối thiểu 32 ký tự. KHÔNG dùng giá trị mặc định ở môi trường thật.
    secret: ${JWT_SECRET:dev-only-secret-change-me-please-0123456789abcdef}
    access-ttl: PT15M
    refresh-ttl: P7D
  auth:
    school-email-domains: ${SCHOOL_EMAIL_DOMAINS:phenikaa-uni.edu.vn}
    otp-ttl: PT10M
    otp-max-attempts: 5
    otp-resend-cooldown: PT1M
    otp-max-sends-per-hour: 5
    otp-pepper: ${OTP_PEPPER:dev-only-otp-pepper-change-me}
  order:
    pending-ttl: PT5M            # hạn quầy xác nhận đơn Pending (BR13)
    max-quantity-per-item: 20
    pickup-wait: PT15M           # chờ thêm sau khung nhận hoặc sau khi báo Ready (BR22)
  incident:
    window-days: 30          # BR26: cửa sổ trượt tính vi phạm
    escalate-at: 3           # BR27: từ lần thứ 3 chuyển quản trị viên
    restriction-days: 7      # BR31: thời hạn hạn chế mặc định
    max-restriction-days: 30
  jobs:
    enabled: true                # false: tắt mọi lịch chạy nền (dùng khi test)
    batch-size: 100
    pending-expiry-interval: PT30S       # Pending quá hạn xác nhận sang Expired (BR13)
    entitlement-expiry-interval: PT10M
    restriction-expiry-interval: PT5M
  notification:
    max-attempts: 5              # quá số lần thì email FAILED, thông báo trong ứng dụng vẫn còn (NFR05)
    outbox-batch-size: 20
    lease: PT2M
    poll-interval: PT15S         # chu kỳ quét hàng đợi email
  ocr:
    enabled: ${OCR_ENABLED:false}        # OCR là tùy chọn (BR09); bật cần cài Tesseract, xem README
    tessdata-path: ${TESSDATA_PATH:}     # thư mục chứa vie.traineddata và eng.traineddata
    language: vie+eng
    draft-ttl: PT10M                     # bản nháp (chỉ chữ, không ảnh) tự xóa sau chừng này (BR10)
    cleanup-interval: PT1M
    max-image-size: 3MB
    max-pixels: 12000000
    max-scans-per-hour: 10
    max-concurrent: 2
    engine-timeout: PT20S
    max-drafts: 5000
    student-code-pattern: '\d{8,10}'     # chỉnh theo mã sinh viên thật của trường
  storage:
    dir: ${STORAGE_DIR:./uploads}
    max-file-size: 2MB
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173,http://localhost:3000}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
